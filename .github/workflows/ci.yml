name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, unit tests, security checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (validates the wrapper jar)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # check = lint + unit tests (+ verifyNoInternetPermission from Phase 1)
      - name: Check and build debug APK
        run: ./gradlew check assembleDebug --stacktrace

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  instrumented:
    name: On-device tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (validates the wrapper jar)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # Lets the emulator use hardware acceleration on GitHub's Linux runner (runner-only change).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Product owner approved accepting the standard Android SDK licences on the CI runner
      # (needed to download the emulator system image). "yes || true" avoids a SIGPIPE failure.
      - name: Accept Android SDK licences
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # Gradle Managed Device defined in app/build.gradle.kts (Pixel 2, API 30, ATD image).
      - name: Run on-device tests
        run: >
          ./gradlew pixel2api30DebugAndroidTest --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # Phase 8: the same suite against the R8-shrunk release build ("staging" = release + debug key).
      - name: Run on-device tests on the release (R8) build
        run: >
          ./gradlew pixel2api30StagingAndroidTest -PtestBuildType=staging --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # Gradle reports success when the test runner crashes before any test starts (seen in Phase 8),
      # so fail unless both runs really executed tests.
      - name: Check that on-device tests actually ran
        run: |
          for build in debug staging; do
            count=$(cat app/build/outputs/androidTest-results/managedDevice/$build/*/*.xml 2>/dev/null | grep -c "<testcase" || true)
            echo "$build: $count test cases"
            if [ "$count" -eq 0 ]; then echo "No on-device tests ran for $build"; exit 1; fi
          done

      - name: Upload on-device test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: on-device-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
